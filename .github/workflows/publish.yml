on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      
      - name: Point RCall.jl at system R
        run: |
          echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"
          echo "Using R_HOME=$(R RHOME)"

      - name: Instantiate Julia Environments
        run: |
          for dir in notes/module*/; do
            if [ -f "${dir}Project.toml" ]; then
              echo "Instantiating Julia environment in: ${dir}"
              julia --project="${dir}" -e 'using Pkg; Pkg.instantiate()'
            fi
          done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}